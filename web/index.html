<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ULTRON 2.7 Interface</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="ultron-scene" aria-label="ULTRON animated plasma sphere"></canvas>
    <div class="digital-noise" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ULTRON 2.7</p>
          <h1>Neural Voice Interface</h1>
        </div>
        <div class="status-stack">
          <div class="status-strip">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusLabel">Idle</span>
          </div>
          <div id="voiceBadge" class="voice-badge">Voice standby</div>
        </div>
      </header>

      <section class="stage" aria-label="Assistant visual state">
        <div class="sphere-space"></div>
      </section>

      <section class="subtitles" id="subtitlePanel" aria-live="polite">
        <div class="subtitle-header">
          <span>Live subtitles</span>
          <button id="subtitleToggle" type="button" aria-pressed="true">On</button>
        </div>
        <p id="subtitleText">ULTRON 2.7 online.</p>
      </section>

      <section class="voice-console" aria-label="Voice controls">
        <button id="micToggle" type="button">Mic On</button>
        <button id="alwaysListeningToggle" type="button" aria-pressed="false">Always Off</button>
        <button id="pushToTalkToggle" type="button" aria-pressed="true">Push-to-talk</button>
        <button id="muteToggle" type="button" aria-pressed="false">Mute Off</button>
        <button id="stopSpeakingButton" type="button">Stop Voice</button>
        <button id="confirmVoiceButton" class="confirm-action" type="button" hidden>Confirm</button>
        <button id="mockVoiceButton" type="button">Mock Voice</button>
      </section>

      <section class="provider-panel" aria-label="Voice provider status">
        <div>
          <span>STT</span>
          <strong id="sttProviderLabel">text_payload</strong>
          <small id="sttProviderDetail">Ready</small>
        </div>
        <div>
          <span>TTS</span>
          <strong id="ttsProviderLabel">browser_speech_synthesis</strong>
          <small id="ttsProviderDetail">Ready</small>
        </div>
        <button id="refreshProvidersButton" type="button">Refresh</button>
        <button id="testProvidersButton" type="button">Test Voice</button>
      </section>

      <section class="wake-panel" aria-label="Wake word and voice activity status">
        <div>
          <span>Microphone</span>
          <strong id="micStatusLabel">Off</strong>
          <small id="micPrivacyDetail">Push-to-talk available</small>
        </div>
        <div>
          <span>Wake gate</span>
          <strong id="wakeStateLabel">Inactive</strong>
          <small id="wakeDetail">Say ULTRON or Hey ULTRON</small>
        </div>
        <div>
          <span>Voice activity</span>
          <strong id="vadStateLabel">Idle</strong>
          <small id="vadDetail">No speech segment yet</small>
        </div>
      </section>

      <section class="command-row" aria-label="Command input">
        <input id="commandInput" type="text" autocomplete="off" placeholder="Type a command for ULTRON..." />
        <button id="sendButton" type="button">Send</button>
      </section>

      <section class="voice-history" aria-label="Voice transcript history">
        <div class="history-header">Transcript history</div>
        <ol id="voiceHistory"></ol>
      </section>

      <nav class="state-controls" aria-label="Visual state controls">
        <button data-state="listening" type="button">Listening</button>
        <button data-state="thinking" type="button">Thinking</button>
        <button data-state="speaking" type="button">Speaking</button>
        <button data-state="idle" type="button">Idle</button>
      </nav>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
