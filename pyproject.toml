[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron27"
version = "0.1.0"
description = "Local-first Jarvis-style laptop assistant MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "deeps2710" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ultron = "ultron27.cli:main"
ultron-ui = "ultron27.web_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
